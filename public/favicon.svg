<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <path id="favCurve" d="M 88,256 A 168,168 0 0,1 424,256" fill="none" />
  </defs>

  <!-- Circular Outer Disc -->
  <circle cx="256" cy="256" r="248" fill="#F4FAF6" />
  
  <!-- Outer Main Ring -->
  <circle cx="256" cy="256" r="236" fill="#FFFFFF" stroke="#137333" stroke-width="14" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="#137333" stroke-width="6" />

  <!-- Top Curved Brand Text: A G R O C A R E -->
  <text fill="#0F172A" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="36" letter-spacing="14">
    <textPath href="#favCurve" startOffset="50%" text-anchor="middle">AGROCARE</textPath>
  </text>

  <!-- Central Botanical Emblem -->
  <g id="botanical-leaves" transform="translate(0, 10)">
    <!-- Bottom Left Dark Leaf -->
    <path d="M 256,305 C 240,290 150,285 130,225 C 160,205 210,240 256,305 Z" fill="#137333" />
    <!-- Bottom Right Dark Leaf -->
    <path d="M 256,305 C 272,290 362,285 382,225 C 352,205 302,240 256,305 Z" fill="#137333" />
    <!-- Middle Left Vibrant Leaf -->
    <path d="M 256,300 C 235,260 170,220 185,160 C 220,165 245,225 256,300 Z" fill="#43A047" />
    <!-- Middle Right Vibrant Leaf -->
    <path d="M 256,300 C 277,260 342,220 327,160 C 292,165 267,225 256,300 Z" fill="#43A047" />
    <!-- Center Upright Primary Leaf -->
    <path d="M 256,115 C 278,150 286,210 256,305 C 226,210 234,150 256,115 Z" fill="#4CAF50" />
    <!-- Stem white veins -->
    <path d="M 256,230 L 256,308" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <path d="M 245,290 C 238,265 220,240 205,230" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 267,290 C 274,265 292,240 307,230" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Lower Banner Ribbon -->
  <g id="banner-ribbon">
    <path d="M 62,336 Q 256,322 450,336 L 442,406 Q 256,444 70,406 Z" fill="#FFFFFF" stroke="#137333" stroke-width="8" stroke-linejoin="round" />
    <text x="256" y="386" font-family="'Arial Black', 'Impact', -apple-system, sans-serif" font-weight="900" font-size="44" letter-spacing="4" text-anchor="middle" fill="#0A0A0A">SOLUTION</text>
  </g>
</svg>
